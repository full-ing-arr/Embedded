[env:bare]
platform = espressif32@7.0.1
platform_packages = platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
board = sixspan_s3_n16r8
framework =

; Verified CPU clock after reset into the ROM UART downloader.
board_build.f_cpu = 40000000L

; ESP image header fields; load_ram does not use them to configure flash.
board_build.f_image = 40000000L
board_build.flash_mode = dio

board_build.ldscript = bare/memory.ld
; DRAM region reserved by memory.ld, not total chip RAM.
board_upload.maximum_ram_size = 16384

build_flags = -ffreestanding
extra_scripts = post:scripts/bare.py

upload_protocol = custom
upload_port = COM4
upload_command = "$PYTHONEXE" "$OBJCOPY" --chip esp32s3 --port "$UPLOAD_PORT" --no-stub load_ram "$SOURCE"

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
